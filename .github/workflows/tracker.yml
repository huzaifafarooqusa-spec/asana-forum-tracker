name: Asana Forum Monitor

on:
  schedule:
    # Every 5 minutes (GitHub may delay or skip scheduled runs under load)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      test_draft:
        description: 'Send a test AI draft for the latest question (no alerts, no state change)'
        type: boolean
        default: false
      probe_models:
        description: 'Check which AI models each provider key can use (no alerts, no state change)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: asana-forum-monitor
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # State lives on its own branch so bot commits never touch main
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: .state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STATE_FILE: .state/state.json
          # Optional overrides (repo Settings → Variables)
          WATCH_CATEGORIES: ${{ vars.WATCH_CATEGORIES }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          ONLY_PRIORITY: ${{ vars.ONLY_PRIORITY }}
          DRAFT_MODE: ${{ vars.DRAFT_MODE }}
          OLLAMA_MODELS: ${{ vars.OLLAMA_MODELS }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          DRAFT_DAILY_LIMIT: ${{ vars.DRAFT_DAILY_LIMIT }}
        run: python tracker.py ${{ inputs.test_draft && '--test-draft' || '' }} ${{ inputs.probe_models && '--probe' || '' }}

      - name: Persist state
        if: always()
        working-directory: .state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then echo "No state changes"; exit 0; fi
          git commit -m "Update tracker state"
          git push origin HEAD:state

      - name: Alert on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=❌ Asana forum tracker run failed: ${RUN_URL}"
